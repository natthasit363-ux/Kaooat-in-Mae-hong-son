<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคิดเงินหน้าร้าน (POS) + เงินทอน</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 750px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f6f9;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        
        .scan-section {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        .scan-input {
            width: 80%;
            padding: 12px 15px;
            font-size: 18px;
            border: 2px solid #007bff;
            border-radius: 8px;
            text-align: center;
            outline: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th { background-color: #007bff; color: white; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }

        /* ส่วนคำนวณเงินทอน */
        .payment-section {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .pay-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .pay-input {
            width: 150px;
            padding: 8px;
            font-size: 18px;
            text-align: right;
            border: 2px solid #28a745;
            border-radius: 6px;
        }
        .total-box { font-size: 22px; font-weight: bold; color: #007bff; }
        .change-box { font-size: 24px; font-weight: bold; color: #28a745; }
        .change-box.short { color: #dc3545; }

        .alert-error {
            color: #dc3545;
            text-align: center;
            margin-top: 5px;
            font-weight: bold;
            min-height: 24px;
        }
        .btn-reset {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-reset:hover { background-color: #5a6268; }
    </style>
</head>
<body>
       <header>
        <nav>
            <div class="logo">หมาด๋าม</div>
            
            <ul class="nav-links">
                <li><a href="index.html" class="active">หน้าหลัก</a></li>
                <li><a href="bali1.html">บาลี1</a></li>
                <li><a href="bali2.html">บาลี2</a></li>
                <li><a href="aengsae.html">เพลงอมตะมหาทรงพลัง</a></li>
                <li><a href="Myfamily.html"></a></li>
            </ul>
        </nav>
    </header>

<div class="container">
    <h2>🛒 ระบบแคชเชียร์ + คำนวณเงินทอน</h2>
    
    <div class="scan-section">
        <input type="text" id="scan-input" class="scan-input" placeholder="ยิงบาร์โค้ดสินค้า..." autofocus autocomplete="off">
    </div>

    <div id="error-msg" class="alert-error"></div>

    <!-- ตารางสินค้า -->
    <table>
        <thead>
            <tr>
                <th>รหัสสินค้า</th>
                <th>ชื่อสินค้า</th>
                <th class="text-center">จำนวน</th>
                <th class="text-right">ราคา/ชิ้น</th>
                <th class="text-right">ราคารวม</th>
            </tr>
        </thead>
        <tbody id="cart-table">
            <tr id="empty-row">
                <td colspan="5" class="text-center" style="color: #888;">ยังไม่มีรายการสินค้า (สลับภาษาแป้นพิมพ์เป็น EN แล้วยิงสแกนได้เลย)</td>
            </tr>
        </tbody>
    </table>

    <!-- สรุปยอดเงินและคำนวณเงินทอน -->
    <div class="payment-section">
        <div class="pay-row total-box">
            <span>ยอดรวมทั้งหมด:</span>
            <span><span id="grand-total">0</span> บาท</span>
        </div>
        <div class="pay-row">
            <span>รับเงินมา:</span>
            <span>
                <input type="number" id="cash-input" class="pay-input" placeholder="0" min="0"> บาท
            </span>
        </div>
        <hr style="border: 0; border-top: 1px solid #ccc; margin: 10px 0;">
        <div class="pay-row change-box" id="change-container">
            <span>เงินทอน:</span>
            <span><span id="change-total">0</span> บาท</span>
        </div>
    </div>

    <button class="btn-reset" onclick="resetCart()">เริ่มขายรายการใหม่ (Clear)</button>
</div>

<script>
    // ฐานข้อมูลสินค้าตัวอย่าง
    const productDatabase = {
    "0110000000000007": { name: "ขนมปังปิ้ง(แผ่นละ)", price: 10 },
        "0120000000000004": { name: "น้ำส้มคั้นสด", price: 25 },
        "0188500000000102": { name: "สมุดโน้ต A5", price: 35 },
        "0188500000000103": { name: "ผัดไทย", price: 40 },
        "0188500000000104": { name: "ก๋วยเตี๊ยว", price: 35 },
        "0188500000000105": { name: "กวยจั๊บ", price: 45 },
        "0188500000000106": { name: "น้ำเปล่า", price: 5 },
        "0188500000000107": { name: "น้ำอัดลม", price: 15 },
    };

    let cart = {};
    let grandTotal = 0;

    const scanInput = document.getElementById('scan-input');
    const cashInput = document.getElementById('cash-input');
    const cartTable = document.getElementById('cart-table');
    const grandTotalDisplay = document.getElementById('grand-total');
    const changeTotalDisplay = document.getElementById('change-total');
    const changeContainer = document.getElementById('change-container');
    const errorMsg = document.getElementById('error-msg');

    // 1. รับค่าการยิงบาร์โค้ดสินค้า
    scanInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            
            let code = this.value.trim();
            errorMsg.innerText = '';

            if (code !== '') {
                if (productDatabase[code]) {
                    let product = productDatabase[code];

                    if (cart[code]) {
                        cart[code].qty += 1;
                    } else {
                        cart[code] = {
                            name: product.name,
                            price: product.price,
                            qty: 1
                        };
                    }

                    updateCartUI();
                } else {
                    errorMsg.innerText = `❌ ไม่พบข้อมูลสินค้ารหัส: ${code}`;
                }

                this.value = '';
            }
        }
    });

    // 2. คำนวณเงินทอนเมื่อมีการพิมพ์จำนวนเงินที่รับมา
    cashInput.addEventListener('input', calculateChange);

    function updateCartUI() {
        cartTable.innerHTML = '';
        grandTotal = 0;

        for (let code in cart) {
            let item = cart[code];
            let itemTotal = item.price * item.qty;
            grandTotal += itemTotal;

            let row = `
                <tr>
                    <td>${code}</td>
                    <td>${item.name}</td>
                    <td class="text-center">${item.qty}</td>
                    <td class="text-right">${item.price} ฿</td>
                    <td class="text-right">${itemTotal} ฿</td>
                </tr>
            `;
            cartTable.innerHTML += row;
        }

        grandTotalDisplay.innerText = grandTotal.toLocaleString();
        calculateChange(); // คำนวณเงินทอนใหม่ทุกครั้งที่สินค้าเปลี่ยน
    }

    // 3. ฟังก์ชันคำนวณเงินทอน
    function calculateChange() {
        let cashReceived = parseFloat(cashInput.value) || 0;
        
        if (grandTotal === 0) {
            changeTotalDisplay.innerText = "0";
            changeContainer.className = "pay-row change-box";
            return;
        }

        let change = cashReceived - grandTotal;

        if (change < 0) {
            // กรณีรับเงินมาไม่พอ
            changeTotalDisplay.innerText = `ขาดอีก ${Math.abs(change).toLocaleString()}`;
            changeContainer.className = "pay-row change-box short";
        } else {
            // เงินพอดีหรือมีเงินทอน
            changeTotalDisplay.innerText = change.toLocaleString();
            changeContainer.className = "pay-row change-box";
        }
    }

    // 4. ล้างหน้าจอเพื่อเริ่มขายบิลใหม่
    function resetCart() {
        cart = {};
        grandTotal = 0;
        cashInput.value = '';
        cartTable.innerHTML = `
            <tr id="empty-row">
                <td colspan="5" class="text-center" style="color: #888;">ยังไม่มีรายการสินค้า</td>
            </tr>
        `;
        grandTotalDisplay.innerText = '0';
        changeTotalDisplay.innerText = '0';
        errorMsg.innerText = '';
        scanInput.focus();
    }

    // ดึงเคอร์เซอร์กลับมาช่องยิงบาร์โค้ด
    document.addEventListener('click', function(e) {
        if (e.target !== cashInput) {
            scanInput.focus();
        }
    });
</script>

</body>
</html>
